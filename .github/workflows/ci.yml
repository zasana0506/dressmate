name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check sample data is valid
        run: |
          python -c "
          import json
          d = json.load(open('samples/wardrobe.json', encoding='utf-8'))
          items = d['items']
          assert len(items) >= 20, '样例衣橱太少'
          slots = {i['slot'] for i in items}
          need = {'base', 'mid', 'outer', 'bottom', 'shoes'}
          missing = need - slots
          assert not missing, f'样例缺少层位: {missing}'
          for i in items:
              assert 0 <= i['clo'] <= 2, f\"clo 越界: {i['name']}\"
              assert 0 <= i['formality'] <= 4, f\"formality 越界: {i['name']}\"
          print(f'样例衣橱 OK：{len(items)} 件')
          "

      - name: Release self-check
        run: python tools/check_release.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dressmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name dm -p 8848:8848 dressmate:ci
          # 等健康检查通过
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8848/api/health > /dev/null; then
              echo "容器健康检查通过"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8848/api/health | tee /dev/stderr | grep -q '"ok": true'
          # 推荐接口必须真能算出结果，而不只是返回 200
          curl -sf "http://127.0.0.1:8848/api/recommend?city=Beijing" \
            | python -c "
          import json, sys
          d = json.load(sys.stdin)
          recs = d.get('recommendations') or []
          assert len(recs) >= 1, '没有产出推荐'
          assert recs[0].get('outfit'), '推荐里没有单品'
          print(f'推荐接口 OK：{len(recs)} 套')
          "
          # 样例衣橱必须已经播种进去
          docker exec dm test -f /data/wardrobe.json
          docker rm -f dm
