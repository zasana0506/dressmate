name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Ubuntu runner 默认 locale 是 C，stdout 用 ASCII 编码。
      # 脚本里有中文输出，不设这一层会抛 UnicodeEncodeError。
      - name: Set locale
        run: |
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          echo "PYTHONIOENCODING=utf-8" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          # tee 会吃掉退出码，这里取 PIPESTATUS 的第一个
          exit "${PIPESTATUS[0]}"

      # 校验逻辑放在脚本文件里，不内联写进 YAML。
      # 内联 python -c "..." 会被 YAML 的引号处理吃掉转义，
      # 表现为「本地能过、CI 必挂」。
      - name: Check sample data
        run: python tools/check_sample.py

      - name: Release self-check
        run: python tools/check_release.py

      # 双语 README 的一致性：改了中文忘了英文，GitHub 上会自相矛盾
      - name: Check bilingual README
        run: python tools/check_readme.py

      # 失败时把完整日志留成 artifact：本地复现不了时，日志就是唯一线索
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "### locale"
            locale || true
            echo "### python"
            python -VV
            echo "### 测试输出"
            cat test-output.txt 2>/dev/null || echo "(没有测试输出文件)"
            echo "### check_sample"
            python tools/check_sample.py 2>&1 || true
            echo "### check_release"
            python tools/check_release.py 2>&1 || true
          } > diagnostics.txt 2>&1 || true
          cat diagnostics.txt
          # 同时写进 step summary，在 run 页面直接能看，不用下载 artifact
          {
            echo "## 测试输出"
            echo '```'
            cat test-output.txt 2>/dev/null || echo "(没有)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 把排盘依赖的实际状态打出来：CI 的 runner 自带 Node 但没有 iztro，
      # 这个差异是「本地过、CI 挂」的常见来源，写进 summary 免得下次再查一遍
      - name: Report optional dependencies
        if: always()
        run: |
          python tools/report_deps.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.python-version }}
          path: diagnostics.txt
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: dressmate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name dm -p 8848:8848 dressmate:ci
          # 等健康检查通过
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8848/api/health > /dev/null; then
              echo "容器健康检查通过"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8848/api/health -o /tmp/health.json
          cat /tmp/health.json
          grep -q '"ok": true' /tmp/health.json
          # 推荐接口必须真能算出结果，而不只是返回 200
          curl -sf "http://127.0.0.1:8848/api/recommend?city=Beijing" \
            -o /tmp/rec.json
          python tools/check_rec.py /tmp/rec.json
          # 关键资产必须都在（漏一个都会让断网兜底之类的功能失效）
          docker exec dm test -f /data/wardrobe.json
          docker exec dm test -f /data/cities.json
          docker exec dm test -f /app/data/climate.json
          docker rm -f dm
