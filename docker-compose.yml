# 一条命令跑起来：
#   docker compose up -d
#   打开 http://localhost:8848
#
# 数据都在 ./data 卷里，容器删了也不丢。
#
# 端口默认只绑本机（127.0.0.1），局域网里的别人访问不到。
# 这是故意的：衣橱和照片是私人的，一部署就全网可见不是好默认值。
# 想让手机连同一个 WiFi 访问，把下面那行改成：
#     - "8848:8848"
# 或者临时用环境变量放开：
#     DRESSMATE_BIND=0.0.0.0 docker compose up -d
# 放到公网请自己套一层反向代理并加 HTTPS 与鉴权。

services:
  dressmate:
    build: .
    image: dressmate:latest
    container_name: dressmate
    restart: unless-stopped
    ports:
      # 默认只绑本机。要局域网访问：改端口映射，或设 DRESSMATE_BIND=0.0.0.0
      - "${DRESSMATE_BIND:-127.0.0.1}:8848:8848"
    volumes:
      # 衣橱、照片、城市表、日程都在这里
      - ./data:/data
    environment:
      # 可选：接一个 OpenAI 兼容的视觉模型，网页上就能「拍照自动识别」。
      # 不配也能用——手工录入衣橱，或直接用文件名批量导入。
      # OLLAMA 示例：
      #   DRESSMATE_AI_BASE_URL: http://host.docker.internal:11434/v1
      #   DRESSMATE_AI_MODEL: qwen2.5vl
      # 云端示例：
      #   DRESSMATE_AI_BASE_URL: https://api.openai.com/v1
      #   DRESSMATE_AI_API_KEY: sk-...
      #   DRESSMATE_AI_MODEL: gpt-4o-mini
      DRESSMATE_AI_BASE_URL: ${DRESSMATE_AI_BASE_URL:-}
      DRESSMATE_AI_API_KEY: ${DRESSMATE_AI_API_KEY:-}
      DRESSMATE_AI_MODEL: ${DRESSMATE_AI_MODEL:-}
      # 可选：设了之后所有写操作都要带令牌。同一局域网的人就能改你的衣橱时用它。
      #   DRESSMATE_TOKEN=你的密码 docker compose up -d
      # 浏览器第一次打开会问你要令牌，输一次就记住了。
      DRESSMATE_TOKEN: ${DRESSMATE_TOKEN:-}
      # 可选：放在反向代理后面时，Host 是代理而 Origin 是你的域名，对不上，
      # 用这个白名单放行（逗号分隔）。
      DRESSMATE_ALLOWED_ORIGINS: ${DRESSMATE_ALLOWED_ORIGINS:-}
      # 可选：让容器跟宿主时区一致（默认就是 Asia/Shanghai）
      TZ: ${TZ:-Asia/Shanghai}
